# ============================================================
# Application Configuration
# ============================================================

app:
  name: "E-Commerce Demand-Supply System"
  version: "1.0.0"
  environment: "development"  # development | staging | production
  debug: true

# ============================================================
# Spark Configuration
# ============================================================
spark:
  app_name: "EcommerceDemandSupply"
  master: "local[*]"           # Use spark://master:7077 in Docker
  executor_memory: "2g"
  driver_memory: "1g"
  executor_cores: 2
  default_parallelism: 8
  shuffle_partitions: 8
  delta_enabled: true
  checkpoint_location: "./data/checkpoints"

# ============================================================
# Data Paths
# ============================================================
data:
  raw_path: "./data/raw"
  processed_path: "./data/processed"
  sample_path: "./data/sample"
  model_path: "./data/models"
  delta_path: "./data/delta"

# ============================================================
# Kafka Configuration
# ============================================================
kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    orders: "ecommerce.orders"
    inventory: "ecommerce.inventory"
    demand_signals: "ecommerce.demand_signals"
  consumer_group: "demand-supply-group"

# ============================================================
# API Configuration
# ============================================================
api:
  host: "0.0.0.0"
  port: 8000
  reload: true
  workers: 1

# ============================================================
# Dashboard Configuration
# ============================================================
dashboard:
  host: "0.0.0.0"
  port: 8501
  refresh_interval_seconds: 30

# ============================================================
# ML Model Configuration
# ============================================================
ml:
  demand_forecast:
    algorithm: "random_forest"      # random_forest | linear_regression | gradient_boost
    forecast_horizon_days: 30
    train_test_split: 0.8
    n_trees: 100
    max_depth: 10
    features:
      - "day_of_week"
      - "month"
      - "is_weekend"
      - "price"
      - "category_encoded"
      - "lag_7"
      - "lag_14"
      - "rolling_mean_7"
  
  price_elasticity:
    min_data_points: 50
    confidence_level: 0.95

  inventory:
    service_level: 0.95
    lead_time_days: 7
    safety_stock_multiplier: 1.645   # z-score for 95% service level

# ============================================================
# Logging
# ============================================================
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  file: "./logs/app.log"
  rotation: "100 MB"
  retention: "30 days"
